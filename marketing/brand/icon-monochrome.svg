<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- The themed-icon layer. Android tints this layer's alpha, so the pie can
     only read through negative space: the crust, the three slices and the
     face are cut apart by transparent gaps, never by colour. Gaps and face
     are drawn much heavier than in icon.svg because this is seen at 48dp.
     Keep it in step with icon-foreground.svg; render both with render.sh. -->
<mask id="pie" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#000"/>
  <g transform="translate(512 512) scale(1.18) translate(-512 -512)">
    <circle cx="512" cy="512" r="258.75" fill="#fff"/>
    <g fill="none" stroke="#000" stroke-width="29" stroke-linejoin="round" stroke-linecap="round">
      <path transform="translate(11.9 -22.0)" d="M512.0 512.0 L443.4 324.1 A200.0 200.0 0 0 1 707.0 467.5 Z"/>
      <path d="M512.0 512.0 L707.0 467.5 A200.0 200.0 0 0 1 354.5 635.3 Z"/>
      <path d="M512.0 512.0 L354.5 635.3 A200.0 200.0 0 0 1 443.4 324.1 Z"/>
    </g>
    <ellipse cx="464.5" cy="602.0" rx="17.5" ry="23.5" fill="#000"/>
    <ellipse cx="559.5" cy="602.0" rx="17.5" ry="23.5" fill="#000"/>
    <path d="M490.0 630.0 q22.0 27.0 44.0 0" fill="none" stroke="#000" stroke-width="17" stroke-linecap="round"/>
  </g>
</mask>
<rect width="1024" height="1024" fill="#000" mask="url(#pie)"/>
</svg>
